abstract: |
  Set-theoretic type systems infer precise polymorphic types for unannotated functions in
  dynamic languages, capturing overloaded behaviour through intersections, unions, and
  negations of types. The price of this precision is readability: inferred signatures are
  often far more verbose than the type a programmer would write by hand. Worse, an overly
  precise signature propagates through inference into every definition that uses it, so
  simplifying one signature can yield more straightforward types across the entire codebase.
  We present an interactive typing toolkit, a VS Code extension backed by an LSP server on top
  of the MLsem typing library, that lets the programmer reshape an inferred type through
  simple, semantically justified operations such as instantiation of type variables and
  merging of overloads, exploring the spectrum of correct types for a function and choosing
  where on the precision–readability scale to stop. Readability is not the only concern: a
  narrower contract than the code happens to admit can also capture intent. We outline the
  toolkit's design and our plans to apply it to the R language.

