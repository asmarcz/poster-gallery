abstract: |
  R hides much of what a value is: its storage type, its shape (scalar, vector or matrix)
  and its S3 classes are all invisible at the call site, so mistakes surface late, far from
  their cause, or not at all. We propose a type system for R that makes these explicit where
  needed, aiming for a sweet spot between precision and ergonomics.

  Types are sets: atomic vectors and scalars, lists and records, S3 classes and functions
  combine with union, intersection and negation. The system supports overloading,
  parametric and row polymorphism, and narrowing on typeof checks. The Typr tool parses R
  code and native libraries and type-checks R definitions, leaving unannotated code
  gradually typed. Editor integration, runtime checks and type inference are future work.

