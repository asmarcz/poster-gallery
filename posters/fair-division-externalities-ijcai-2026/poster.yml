abstract: |
  We study the problem of allocating a set of indivisible items among agents whose preferences
  include externalities. Unlike the standard fair division model, agents may derive positive or
  negative utility not only from items allocated directly to them, but also from items allocated
  to other agents. Since exact envy-freeness cannot be guaranteed, prior work has focused on its
  relaxations. However, two central questions remained open: does there always exist an
  allocation that is envy-free up to one item (EF1), and if not, what is the optimal relaxation
  EF-k that can always be attained?

  We settle both questions by deriving tight asymptotic bounds on the number of items sufficient
  to eliminate envy. We show that for any instance with n agents, an allocation that is
  envy-free up to O(√n) items always exists and can be found in polynomial time, and we prove a
  matching Ω(√n) lower bound showing that this result is tight even for binary valuations, which
  rules out the existence of EF1 allocations when agents have externalities.

paper: https://arxiv.org/abs/2601.13287
