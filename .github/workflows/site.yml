# Builds the site on every pull request (this is what validates a submission)
# and deploys it to GitHub Pages on every push to main.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pdftoppm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # Thumbnails are keyed by each PDF's hash, so only new or changed posters are rendered.
      # The key changes whenever any PDF changes; restore-keys picks up the previous cache.
      - name: Cache poster thumbnails
        uses: actions/cache@v6
        with:
          path: .cache/thumbs
          key: thumbs-v1-${{ hashFiles('posters/*/poster.pdf', 'scripts/prepare-assets.mjs') }}
          restore-keys: thumbs-v1-

      # Astro's content data store and optimised-image cache.
      - name: Cache Astro build data
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: astro-${{ hashFiles('package-lock.json') }}-

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
