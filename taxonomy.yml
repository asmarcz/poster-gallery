# Research fields a poster can be filed under.
#
# A poster refers to a field by its id: a top-level key ("Biology"), a key and one of its
# subfields ("Biology/Ecology"), or a key, a scheme and an entry of that scheme
# ("CS/arXiv/cs.PL").
# To add a field, add it here in the same pull request as the poster.
# Ids use PascalCase with no spaces; `label` is what the site shows.
#
# `schemes` attaches established classifications to a field. Each scheme has a label and a
# file in taxonomy/ that maps entry paths ("a/b/c", one step per level) to names; those
# files are generated by the scripts in scripts/.

CS:
  label: Computer Science
  schemes:
    ACMCCS:
      label: ACM CCS
      file: taxonomy/acm-ccs.yml
    arXiv:
      label: arXiv
      file: taxonomy/arxiv-cs.yml

Mathematics:
  label: Mathematics

Physics:
  label: Physics

Chemistry:
  label: Chemistry

Biology:
  label: Biology
  subfields:
    Bioinformatics: Bioinformatics
    Ecology: Ecology
    Genetics: Genetics

Medicine:
  label: Medicine

Engineering:
  label: Engineering

EarthSciences:
  label: Earth Sciences

Economics:
  label: Economics

SocialSciences:
  label: Social Sciences

Humanities:
  label: Humanities
