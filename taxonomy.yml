  subfields:
    Bioinformatics: Bioinformatics
    Ecology: Ecology
    Genetics: Genetics
  schemes:
    arXiv: { label: arXiv, file: taxonomy/arxiv-q-bio.yml }
    bioRxiv: { label: bioRxiv, file: taxonomy/biorxiv.yml }
    SpringerLifeSciences: { label: Springer Life Sciences, file: taxonomy/springer-life-sciences.yml }
    SpringerBiomedicine: { label: Springer Biomedicine, file: taxonomy/springer-biomedicine.yml }

