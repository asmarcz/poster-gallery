# Research fields a poster can be filed under.
#
# A poster refers to a field by its id: a top-level key ("Biology"), a key and one of its
# subfields ("Biology/Ecology"), or a key, a scheme and an entry of that scheme
# ("CS/arXiv/cs.PL").
# To add a field, add it here in the same pull request as the poster.
# Ids use PascalCase with no spaces; `label` is what the site shows.
#
# `schemes` attaches established classifications to a field. Each scheme has a label and one
# or more files in taxonomy/ that map entry paths ("a/b/c", one step per level) to names;
# those files are generated by the scripts in scripts/:
#   acm_ccs.py   ACM Computing Classification System
#   arxiv.py     arXiv categories, one file per arXiv group
#   rxiv.py      bioRxiv, medRxiv and ChemRxiv subject areas
#   springer.py  Springer Nature subjects, one file per Springer discipline

CS:
  label: Computer Science
  schemes:
    ACMCCS: { label: ACM CCS, file: taxonomy/acm-ccs.yml }
    arXiv: { label: arXiv, file: taxonomy/arxiv-cs.yml }
    SpringerComputerScience: { label: Springer Computer Science, file: taxonomy/springer-computer-science.yml }

Mathematics:
  label: Mathematics
  schemes:
    arXiv: { label: arXiv, file: [taxonomy/arxiv-math.yml, taxonomy/arxiv-stat.yml] }
    SpringerMathematics: { label: Springer Mathematics, file: taxonomy/springer-mathematics.yml }
    SpringerStatistics: { label: Springer Statistics, file: taxonomy/springer-statistics.yml }

