# Research fields a poster can be filed under.
#
# A poster refers to a field by its id: either a top-level key ("Biology")
# or a key and one of its subfields ("CS/SoftwareNotationsAndTools").
# To add a field, add it here in the same pull request as the poster.
# Ids use PascalCase with no spaces; `label` is what the site shows.

# Subfields are the first- and second-level concepts of the ACM Computing Classification
# System (2012), https://dl.acm.org/ccs: each broad class is followed by its concepts.
# Use a broad class when no concept fits. Finer ACM concepts, like "programming languages",
# go in tags.
