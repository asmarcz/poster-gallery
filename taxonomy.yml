# Research fields a poster can be filed under.
#
# A poster refers to a field by its id: either a top-level key ("Biology")
# or a key and one of its subfields ("Biology/Ecology").
# To add a field, add it here in the same pull request as the poster.
# Ids use PascalCase with no spaces; `label` is what the site shows.

# Computer Science subfields are the ACM Computing Classification System, listed in
# acm-ccs.yml, with ids like "CS/ACMCCS/SoftwareAndItsEngineering/SoftwareNotationsAndTools".
# Subfields added here are used alongside them.
CS:
  label: Computer Science

Mathematics:
  label: Mathematics

Physics:
  label: Physics

Chemistry:
  label: Chemistry

Biology:
  label: Biology
  subfields:
    Bioinformatics: Bioinformatics
    Ecology: Ecology
    Genetics: Genetics

Medicine:
  label: Medicine

Engineering:
  label: Engineering

EarthSciences:
  label: Earth Sciences

Economics:
  label: Economics

SocialSciences:
  label: Social Sciences

Humanities:
  label: Humanities
